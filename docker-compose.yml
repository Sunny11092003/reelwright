# Local development stack.
#   docker compose up --build                 -> backend + n8n
#   docker compose --profile full up --build  -> backend + n8n + built frontend on :8080
services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      N8N_BASE_URL: http://n8n:5678
    ports: ["4000:4000"]
    depends_on: [n8n]
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest   # pin a specific version for production
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      WEBHOOK_URL: http://localhost:5678/
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"     # workflows read the ACA_* values below
      N8N_RUNNERS_ENABLED: "true"
      ACA_BACKEND_URL: http://backend:4000
      ACA_INTERNAL_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
      ACA_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?set N8N_WEBHOOK_SECRET in .env}
    volumes: ["n8n_data:/home/node/.n8n"]
    restart: unless-stopped

  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  n8n_data:
